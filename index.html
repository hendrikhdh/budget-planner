<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Kein user-scalable=no: das sperrt Pinch-Zoom (WCAG 1.4.4). viewport-fit=cover
         aktiviert die env(safe-area-inset-*)-Abstände, die Header, BottomNav und
         Modals bereits verwenden. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://apis.google.com https://*.firebaseapp.com;
      style-src 'self' 'unsafe-inline';
      connect-src 'self'
        https://*.googleapis.com
        https://*.firebaseio.com
        wss://*.firebaseio.com
        https://identitytoolkit.googleapis.com
        https://securetoken.googleapis.com;
      img-src 'self' data: https://lh3.googleusercontent.com https:;
      frame-src https://budget-planner-pro-37aca.firebaseapp.com https://accounts.google.com https://*.firebaseapp.com;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
    " />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Money Maker" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Startwert; useTheme.js setzt ihn beim Mount auf die Farbe des aktiven Themes. -->
    <meta name="theme-color" content="#0d0d1a" />
    <title>Money Maker</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
